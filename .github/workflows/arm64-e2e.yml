name: ARM64 E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-e2e:
    name: ARM64 E2E (${{ matrix.topology }})
    strategy:
      fail-fast: false
      matrix:
        topology: [host, host-to-private]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      GHOSTSCOPE_PRESERVE_PRECOMPILED_FIXTURES: 1
      GHOSTSCOPE_REQUIRE_RUST_135_E2E: 1
      GHOSTSCOPE_REQUIRE_RUST_E2E_TOOLCHAINS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check native kernel and BPF privileges
        run: |
          test "$(uname -m)" = aarch64
          test -r /sys/kernel/btf/vmlinux
          sudo python3 scripts/e2e/vm/check_arm64_bpf.py

      - name: Install LLVM 22 and Polly
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev build-essential binutils clang-18 python3-pyelftools

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Install Rust e2e compatibility toolchains
        run: |
          mapfile -t toolchains < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' e2e-tests/rust-compat-toolchains.txt
          )
          rustup toolchain install --profile minimal "${toolchains[@]}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-arm64-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-arm64-e2e-

      # Build from the PR sources. This does not depend on publishing a new
      # multiarch manifest or on the x86 jobs' pinned image digests.
      - uses: docker/setup-buildx-action@v3

      - name: Build native fixture compiler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/fixture-compiler/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ghostscope-fixture-compiler:arm64-ci
          cache-from: type=gha,scope=fixture-compiler-arm64
          # Both jobs reuse this image; only the host job updates its cache.
          cache-to: ${{ matrix.topology == 'host' && 'type=gha,mode=max,scope=fixture-compiler-arm64' || '' }}

      - name: Build native topology runtime image
        if: matrix.topology == 'host-to-private'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e-runtime/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ghostscope-e2e-runtime:arm64-ci
          cache-from: type=gha,scope=e2e-runtime-arm64
          cache-to: type=gha,mode=max,scope=e2e-runtime-arm64

      - name: Compile full native fixture suite
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/e2e-tests:/workspace/e2e-tests" \
            -w /workspace/e2e-tests \
            ghostscope-fixture-compiler:arm64-ci \
            bash ./compile-fixtures.sh
          sudo chown -R "$(id -u):$(id -g)" e2e-tests/tests/fixtures
          bash ./e2e-tests/compile-rust-compat-fixtures.sh

      - name: Lint native runtime and tests
        if: matrix.topology == 'host'
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy -p ghostscope-e2e-tests --all-features \
            --test architecture_execution --test backtrace_execution \
            --test c_multithread_execution --test entry_value_recovery_execution \
            --test member_pointer_compilation --test startup_load_report_execution -- -D warnings

      - name: Test native architecture primitives
        if: matrix.topology == 'host'
        run: |
          cargo test -p ghostscope-platform -p ghostscope-process --lib --all-features
          cargo test -p ghostscope-compiler --lib --all-features architecture_tests
          cargo test -p ghostscope-dwarf --lib --all-features index::cfi_index::

      - name: Build GhostScope CLI and dwarf-tool
        run: cargo build -p ghostscope -p dwarf-tool --all-features

      - name: Run full native e2e
        if: matrix.topology == 'host'
        run: |
          sudo -E "$(which cargo)" test -p ghostscope-e2e-tests --all-features \
            --tests --no-fail-fast -- --nocapture

      - name: Run full e2e against private containers
        if: matrix.topology == 'host-to-private'
        env:
          E2E_CONTAINER_IMAGE: ghostscope-e2e-runtime:arm64-ci
          E2E_SANDBOX_SESSION: arm64-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_GHOSTSCOPE_SANDBOX: host
          E2E_TARGET_SANDBOX: docker-private
          E2E_TARGET_MODE: same
        run: |
          sudo -E "$(which cargo)" test -p ghostscope-e2e-tests --all-features \
            --tests --no-fail-fast -- --nocapture

      - name: Clean up session containers
        if: always() && matrix.topology == 'host-to-private'
        env:
          E2E_SANDBOX_SESSION: arm64-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ids=$(docker ps -aq --filter "label=ghostscope.session=$E2E_SANDBOX_SESSION")
          if [ -n "$ids" ]; then
            docker rm -f $ids
          fi
