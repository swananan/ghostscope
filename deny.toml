[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
allow-wildcard-paths = true
skip = [
    { crate = "hashbrown@0.16.1", reason = "gimli and ratatui-core currently use this alongside aya/indexmap's newer hashbrown" },
    { crate = "object@0.39.1", reason = "aya and aya-obj still use this version without the compression feature" },
    { crate = "syn@2.0.117", reason = "existing proc-macro dependencies use syn 2.x alongside inkwell_internals' syn 3.x" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
